{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}

<h2>Are you sure to delete?? {{ message.title }}</h2>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="table-responsive small">
        <table class="table table-striped table-sm">
            <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">Theme</th>
                <th scope="col">Message</th>
            </tr>
            </thead>
            <tbody>

            <tr>
                <td>{{ message.id }}</td>
                <td>{{ message.title }}</td>
                <td>{{ message.message }}</td>
                <td class="text-end">
                    <button type="submit" class="btn btn-lg btn-block btn-outline-danger">Confirm</button>
                    <a class="btn btn-outline-primary" href="{% url 'mailing:message_list' %}">Cancel</a>
                </td>
            </tr>

            </tbody>
        </table>
    </div>
</form>

{% endblock %}
