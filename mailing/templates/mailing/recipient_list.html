{% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h2>Recipients List of {{user.email}}</h2>

    <div class="btn-toolbar mb-2 mb-md-0">
        <a class="btn btn-outline-primary" href="{% url 'mailing:recipient_create' %}">Add</a>
    </div>
</div>

<div class="table-responsive small">
    <table class="table table-striped table-sm">
        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Email</th>
            <th scope="col">Name</th>
            <th scope="col">Comment</th>
        </tr>
        </thead> {{user.email}}

        <tbody>
        {% for recipient in  object_list %}
        <tr>

            <td>{{ recipient.id }}</td>
            <td>{{ recipient.email }}</td>
            <td>{{ recipient.name }}</td>
            <td>{{ recipient.comment }}</td>
            <td class="text-end" style="width: 20vh;">
                <a class="btn btn-outline-primary" href="{% url 'mailing:recipient_update' recipient.pk %}">Change</a>
                <a class="btn btn-outline-danger" href="{% url 'mailing:recipient_delete' recipient.pk %}">Delete</a>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
